[build-system]
requires = ["setuptools>=71.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_env_schola"
version = "2.1.0"
description = "LeRobot environment integration for Schola"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot>=0.6.2,<0.7",
    "schola>=2.1.0,<2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot_env_schola*"]
