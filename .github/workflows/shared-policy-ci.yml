name: shared-policy CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Prototypes/SharedPolicy/**"
      - ".github/workflows/shared-policy-ci.yml"

  push:
    branches: [main]
    paths:
      - "Prototypes/SharedPolicy/**"
      - ".github/workflows/shared-policy-ci.yml"

permissions:
  contents: read

concurrency:
  group: shared-policy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: Prototypes/SharedPolicy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "Prototypes/SharedPolicy/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Shared Policy tests
        run: uv run --locked pytest -q
