[project]
name = "shared-policy-reference"
version = "0.1.0"
description = "Executable reference for the Shared Policy ONNX contract."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "onnx>=1.18",
    "onnxruntime",
    "torch>=2.10",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
